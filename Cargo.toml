[workspace]
resolver = "3"
members = ["crates/*"]
# `cargo run` starts the desktop app; the CLI runs with `cargo run -p przmterm-cli`.
default-members = ["crates/przmterm-app"]

[workspace.package]
# Development versions carry a `-dev` suffix; see docs/VERSIONING.md.
version = "0.8.0-dev"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rodrigoprazim/przmterm"
homepage = "https://github.com/rodrigoprazim/przmterm"
authors = ["PrzmTerm contributors"]

[workspace.dependencies]
przmterm-core = { path = "crates/przmterm-core" }
przmterm-transport = { path = "crates/przmterm-transport" }
przmterm-term = { path = "crates/przmterm-term" }
przmterm-session = { path = "crates/przmterm-session" }
przmterm-script = { path = "crates/przmterm-script" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "1"
vte = "0.15"
unicode-width = "0.2"
clap = { version = "4.6", features = ["derive"] }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eframe = "0.37"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
# ring instead of aws-lc-rs: no cmake/nasm needed to build on Windows.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2", "des", "dsa"] }
rand = "0.10"
# No libudev: Linux port listing reads /sys, so no system library is needed.
serialport = { version = "4.10", default-features = false }
roxmltree = "0.21"
# Lookaround in keyword patterns (e.g. IPv6 addresses) needs a backtracking engine.
fancy-regex = "0.20"
# Password vault: Argon2id key derivation, XChaCha20-Poly1305 encryption.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
base64 = "0.23"
zeroize = "1"
# Scripts: pure Rust, nothing to install next to the app.
rhai = "1.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Argon2 is far too slow unoptimised; the vault would take seconds to open
# in debug builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
