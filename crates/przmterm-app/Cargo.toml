[package]
name = "przmterm-app"
description = "PrzmTerm desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "przmterm"
path = "src/main.rs"

[dependencies]
przmterm-core.workspace = true
przmterm-transport.workspace = true
przmterm-term.workspace = true
przmterm-session.workspace = true
przmterm-script.workspace = true
przmterm-connect.workspace = true
fancy-regex.workspace = true
eframe.workspace = true
arboard = { version = "3.7", default-features = false }
# Native file dialogs; on Linux through the XDG portal (pure Rust, no GTK).
rfd = "0.15"
dirs.workspace = true
tracing.workspace = true
chrono.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true
# Lists the installed monospace fonts for the terminal text.
fontdb = { version = "0.24", default-features = false, features = ["std", "fs", "memmap", "fontconfig"] }
# Tells monospace fonts and fonts that can draw (not bitmap-only) apart; egui
# already uses it.
skrifa = "0.44"
# Checking for a newer release on GitHub (src/update.rs): the system's
# certificates, so proxies with their own work.
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier", "json"] }
semver = "1"
# Updates (src/update.rs): the release's checksums are checked against the
# release key's OpenPGP signature before anything is installed.
sha2 = "0.11"
ed25519-dalek = { version = "3", default-features = false }
base64 = "0.23"
serde = { workspace = true }
# The terminal grid on the GPU (see src/grid.rs): glyphs filled on the CPU
# as egui does it, quads uploaded as plain bytes.
vello_cpu = { version = "0.2", default-features = false, features = ["std", "u8_pipeline"] }
bytemuck = { version = "1.25", features = ["derive"] }


# The menu bar on macOS: the app menu with About, Settings and the like.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }

# Unpacking an update: the Linux .tar.gz and the Windows .zip.
[target.'cfg(target_os = "linux")'.dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[build-dependencies]
# Windows version information (see build.rs).
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
