[package]
name = "przmterm-app"
description = "PrzmTerm desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "przmterm"
path = "src/main.rs"

[dependencies]
przmterm-core.workspace = true
przmterm-transport.workspace = true
przmterm-term.workspace = true
przmterm-session.workspace = true
przmterm-script.workspace = true
eframe.workspace = true
arboard = { version = "3.7", default-features = false }
# Native file dialogs; on Linux through the XDG portal (pure Rust, no GTK).
rfd = "0.15"
dirs.workspace = true
tracing.workspace = true
chrono.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true


[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

# Pure-Rust Secret Service client: no libdbus needed to build.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "async-io", "crypto-rust"] }

[lints]
workspace = true
