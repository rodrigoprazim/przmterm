[package]
name = "przmterm-connect"
description = "Connecting PrzmTerm sessions: transports with jump hosts, vault entries and saved passwords"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
przmterm-core.workspace = true
przmterm-transport.workspace = true
przmterm-session.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

# Pure-Rust Secret Service client: no libdbus needed to build.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "async-io", "crypto-rust"] }

[lints]
workspace = true
