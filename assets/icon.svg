<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- PrzmTerm icon: a prompt chevron cut like a prism, and the cursor.
       The tile follows the macOS grid (824 px on a 1024 px canvas). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17606b"/>
      <stop offset="1" stop-color="#1a1c3a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <!-- the chevron: upper and lower arms, each in a light and a dark facet -->
  <path d="M250 300 L360 300 L560 512 L450 512 Z" fill="#8fe3ff"/>
  <path d="M250 300 L450 512 L405 512 L250 348 Z" fill="#4fb6e8"/>
  <path d="M450 512 L560 512 L360 724 L250 724 Z" fill="#2f86c4"/>
  <path d="M450 512 L405 512 L250 676 L250 724 Z" fill="#1d6aa6"/>
  <!-- the cursor -->
  <rect x="600" y="636" width="200" height="88" rx="10" fill="#f4f8fc"/>
</svg>
