# cargo-deny: security advisories, licences, banned crates and sources.
# Run locally with `cargo deny check`; CI runs it on every push.

[graph]
all-features = false

[advisories]
# RustSec advisories fail the check; an exception needs an entry here with
# the advisory id and why it does not apply.
ignore = [
    # rsa (through russh, for RSA keys): the Marvin timing attack needs many
    # timed RSA decryptions observed over the network. PrzmTerm only signs
    # once per login with the user's own key and never decrypts with RSA,
    # and no fixed release exists yet.
    { id = "RUSTSEC-2023-0071", reason = "RSA only signs at login; no decryption oracle" },
]
# Unmaintained crates deeper in the tree (fonts, D-Bus, Rhai's strings) are
# reported only when PrzmTerm depends on them directly.
unmaintained = "workspace"

[licenses]
# PrzmTerm is MIT OR Apache-2.0; dependencies must carry a licence that
# allows shipping them in a closed or open binary.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    # File-level copyleft: fine for unmodified dependencies.
    "MPL-2.0",
    # The fonts egui ships (Ubuntu, Hack, Noto).
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    # Mozilla's list of root certificates, as data under a permissive
    # licence: used by the update check's HTTPS client (ureq).
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[bans]
multiple-versions = "allow"
# The workspace crates refer to each other by path, without a version.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
