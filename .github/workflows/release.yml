name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml version $manifest"
            exit 1
          fi
          case "$tag" in
            0.*|*-*) pre=true ;;
            *) pre=false ;;
          esac
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macos-universal
            os: macos-latest
            target: aarch64-apple-darwin
            extra_target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      # Windows binaries are signed through the SignPath Foundation when its
      # token is set (docs/VERSIONING.md, "Signing").
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}${{ matrix.extra_target && format(',{0}', matrix.extra_target) || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p przmterm-app -p przmterm-cli
          if [ -n "${{ matrix.extra_target }}" ]; then
            cargo build --release --locked --target ${{ matrix.extra_target }} -p przmterm-app -p przmterm-cli
          fi

      - name: Collect the Windows binaries
        if: startsWith(matrix.name, 'windows')
        shell: bash
        run: |
          mkdir windows-bin
          cp target/${{ matrix.target }}/release/przmterm.exe target/${{ matrix.target }}/release/przm.exe windows-bin/

      - name: Upload the Windows binaries for signing
        id: unsigned
        if: startsWith(matrix.name, 'windows') && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: windows-bin/

      # Waits for the maintainer to approve the request on SignPath.
      - name: Sign the Windows binaries (SignPath)
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'przmterm' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: windows-bin
          parameters: |
            version: ${{ toJSON(needs.verify.outputs.version) }}

      - name: Package
        shell: bash
        run: |
          version="${{ needs.verify.outputs.version }}"
          dir="przmterm-$version-${{ matrix.name }}"
          mkdir -p "$dir"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$dir/"
          case "${{ matrix.name }}" in
            windows-*)
              cp windows-bin/przmterm.exe windows-bin/przm.exe "$dir/"
              7z a "$dir.zip" "$dir" > /dev/null
              echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
              ;;
            macos-*)
              for bin in przmterm przm; do
                lipo -create -output "$dir/$bin" \
                  target/${{ matrix.target }}/release/$bin \
                  target/${{ matrix.extra_target }}/release/$bin
                # Ad-hoc signature: Apple Silicon runs only signed code, and
                # notarisation needs a paid Apple account.
                codesign --force --sign - "$dir/$bin"
              done
              tar czf "$dir.tar.gz" "$dir"
              echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
              ;;
            *)
              cp target/${{ matrix.target }}/release/przmterm target/${{ matrix.target }}/release/przm "$dir/"
              tar czf "$dir.tar.gz" "$dir"
              echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
              ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: ${{ env.ASSET }}

  publish:
    name: Publish release
    needs: [verify, build]
    runs-on: ubuntu-latest
    env:
      # The checksums are signed when the release key is set
      # (docs/VERSIONING.md, "Signing").
      RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          pattern: release-*
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Sign the checksums (GPG)
        if: env.RELEASE_GPG_KEY != ''
        env:
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          echo "$RELEASE_GPG_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$RELEASE_GPG_PASSPHRASE" \
            --armor --detach-sign dist/SHA256SUMS.txt
      - name: Release notes from CHANGELOG
        run: |
          version="${{ needs.verify.outputs.version }}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: PrzmTerm ${{ needs.verify.outputs.version }}
          body_path: notes.md
          prerelease: ${{ needs.verify.outputs.prerelease }}
          files: dist/*
