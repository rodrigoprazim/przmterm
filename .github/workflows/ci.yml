name: CI

on:
  push:
    branches: [main]
  pull_request:
  # New security advisories show up without a push.
  schedule:
    - cron: "17 9 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # lrzsz lets the Xmodem/Ymodem/Zmodem tests run against sz and rz.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y lrzsz
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      # The release packs PrzmTerm.app in a disk image: check that it builds.
      - if: runner.os == 'macOS'
        run: |
          cargo build -p przmterm-app -p przmterm-cli
          scripts/macos-app.sh 0.0.0-ci target/debug "$RUNNER_TEMP/przmterm-ci.dmg"
          hdiutil attach -quiet -nobrowse -mountpoint "$RUNNER_TEMP/dmg" "$RUNNER_TEMP/przmterm-ci.dmg"
          codesign --verify --strict "$RUNNER_TEMP/dmg/PrzmTerm.app"
          test -x "$RUNNER_TEMP/dmg/PrzmTerm.app/Contents/MacOS/przm"
          hdiutil detach -quiet "$RUNNER_TEMP/dmg"

  deny:
    name: Dependencies (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d '"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
